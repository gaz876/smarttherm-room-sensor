            echo HOST_TEST_OK=test_room_apsta_task
            gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 -pthread -fsanitize=address,undefined -fno-sanitize-recover=all -fno-pie -no-pie -Itests/mock_sdk_stop -Isrc main/room_sdk_stop.c tests/test_room_sdk_stop.c -o /tmp/sdk_stop_host
            for scenario in normal late clock error invalid alloc; do
              timeout 10 /tmp/sdk_stop_host "$scenario"
              echo "SDK_STOP_HOST_OK=$scenario"
            done
            sha256sum main/partitions.csv sdkconfig.defaults
            grep -qx "factory,app,factory,0x120000,2M," main/partitions.csv
            generator="$IDF_PATH/components/partition_table/gen_esp32part.py"
            python "$generator" --flash-size 4MB main/partitions.csv /tmp/new-table.bin
            (cd /tmp; echo "b7e7cc4ebfcb5ce7d928eb74f9aa45866890d09399e7b9c44f3b0fa38cb37246  new-table.bin" | sha256sum -c -)
            idf.py set-target esp32c3
            idf.py build
            test -s build/room_sensor.elf
            test -s build/room_sensor.bin
            cmp build/partition_table/partition-table.bin /tmp/new-table.bin
            echo GENERATED_TABLE_MATCH_OK
            cmp sdkconfig.defaults /input/sdkconfig.defaults
            grep -qx "CONFIG_ROOM_WIFI_HMAC_KEY_ID=-1" sdkconfig
            grep -qx "CONFIG_ESP_PROTOCOMM_SUPPORT_SECURITY_VERSION_2=y" sdkconfig
            if grep -Eq "^CONFIG_(ESP_PROTOCOMM_SUPPORT_SECURITY_VERSION_[01]|NVS_ENCRYPTION|SECURE_FLASH_ENC_ENABLED|SECURE_BOOT|SECURE_BOOT_V2_ENABLED)=y$" sdkconfig; then exit 1; fi
            riscv32-esp-elf-nm build/room_sensor.elf > /tmp/symbols.txt
            for sym in room_phone_channel_close room_sec2_transport_start room_apsta_task_poll room_wifi_apsta_link_attach_io protocomm_security2 room_sdk_stop_bind room_sdk_stop_request room_sdk_stop_poll; do
              grep -E "[[:space:]]$sym$" /tmp/symbols.txt
            done
            idf.py size
            bytes="$(stat -c %s build/room_sensor.bin)"
            printf "CANDIDATE_BYTES=%s\nFACTORY_HEADROOM_BYTES=%s\n" "$bytes" "$((2097152-bytes))"
            test "$bytes" -le 2097152
            sha256sum build/room_sensor.bin build/partition_table/partition-table.bin
            echo COMBINED_SDK_BUILD_OK
          ')"
          docker start -a "$cid"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$cid")" = 0
      - name: Execute actual persistent SDK stop worker in QEMU
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          image=docker.io/espressif/idf@sha256:e5b767c64fdfdf427aa14cc7aaa15d24caf2f22c78241c5a3ed18150cfa7f05c
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/input/main"
          git init -q "$work/repo"
          git -C "$work/repo" -c credential.helper= fetch --no-tags --depth=1 https://github.com/gaz876/smarttherm-room-sensor.git 9d3f99cd3a5bf894007973cc216855e96aded73a
          test "$(git -C "$work/repo" rev-parse FETCH_HEAD)" = 9d3f99cd3a5bf894007973cc216855e96aded73a
          for pair in 329521c22855caaffe41753b1dcf34e4b08ed29d:main/room_sdk_stop.c 6c94a54f9f51f8cb767d51b2cc1b339964ec1202:src/room_sdk_stop.h; do
            expected="${pair%%:*}"
            path="${pair#*:}"
            test "$(git -C "$work/repo" rev-parse "9d3f99cd3a5bf894007973cc216855e96aded73a:$path")" = "$expected"
            git -C "$work/repo" show "9d3f99cd3a5bf894007973cc216855e96aded73a:$path" > "$work/input/main/$(basename "$path")"
          done
          echo SDK_WORKER_RUNTIME_INPUT_OK
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 -o "$work/input/qemu.tar.xz" https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20260417/qemu-riscv32-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz
          test "$(stat -c %s "$work/input/qemu.tar.xz")" = 16842920
          (cd "$work/input"; echo '547f03e04701a92cbb699f7f7d015adc1f5b5ef93cbb94c0dd9b7107e2d84e77  qemu.tar.xz' | sha256sum -c -)
          cat > "$work/input/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(sdk_stop_probe)
          EOF
          cat > "$work/input/main/CMakeLists.txt" <<'EOF'
          idf_component_register(SRCS "probe.c" "room_sdk_stop.c" INCLUDE_DIRS "." REQUIRES esp_http_server esp_netif esp_event esp_timer freertos heap)
          target_compile_options(${COMPONENT_LIB} PRIVATE -Wall -Wextra -Werror)
          EOF
          cat > "$work/input/sdkconfig.defaults" <<'EOF'
          CONFIG_LWIP_NETIF_LOOPBACK=y
          CONFIG_LWIP_IPV4=y
          EOF
          cat > "$work/input/main/probe.c" <<'EOF'
          #include <stdbool.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdatomic.h>
          #include <string.h>
          #include "sdkconfig.h"
          #include "room_sdk_stop.h"
          #include "esp_http_server.h"
          #include "esp_netif.h"
          #include "esp_event.h"
          #include "esp_timer.h"
          #include "esp_heap_caps.h"
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          #include "freertos/semphr.h"
          #if !CONFIG_IDF_TARGET_ESP32C3 || !CONFIG_LWIP_NETIF_LOOPBACK
          #error incorrect isolated target configuration
          #endif
          typedef struct {
              httpd_handle_t server;
              SemaphoreHandle_t entered, release;
              uint8_t *buffer;
              atomic_bool callback_done, stop_entered, stop_done;
              atomic_uint freed;
              esp_err_t stop_result;
          } fixture;
          static fixture cases[3];
          static room_sdk_stop worker;
          static void require_at(bool ok,int line) {
              if(!ok) { printf("SDK_STOP_FAIL line=%d\n",line); fflush(stdout); abort(); }
          }
          #define CHECK(x) require_at((x),__LINE__)
          static void release_context(void *arg) {
              fixture *f=arg;
              CHECK(atomic_load(&f->callback_done));
              CHECK(atomic_load(&f->freed)==0 && f->buffer);
              for(size_t i=0;i<32;i++) CHECK(f->buffer[i]==0);
              free(f->buffer); f->buffer=NULL;
              atomic_fetch_add(&f->freed,1);
          }
          static void server_work(void *arg) {
              fixture *f=arg;
              memset(f->buffer,0x5a,32);
              CHECK(xSemaphoreGive(f->entered)==pdTRUE);
              CHECK(xSemaphoreTake(f->release,pdMS_TO_TICKS(15000))==pdTRUE);
              volatile uint8_t *p=f->buffer;
              for(size_t i=0;i<32;i++) p[i]=0;
              atomic_store(&f->callback_done,true);
          }
          static esp_err_t observed_stop(httpd_handle_t handle) {
              fixture *f=httpd_get_global_user_ctx(handle);
              CHECK(f && handle==f->server);
              atomic_store(&f->stop_entered,true);
              esp_err_t rc=httpd_stop(handle);
              f->stop_result=rc;
              atomic_store(&f->stop_done,true);
              return rc;
          }
          static void scenario(fixture *f,uint64_t window,bool late) {
              atomic_init(&f->callback_done,false); atomic_init(&f->stop_entered,false);
              atomic_init(&f->stop_done,false); atomic_init(&f->freed,0u);
              f->buffer=calloc(32,1); f->entered=xSemaphoreCreateBinary(); f->release=xSemaphoreCreateBinary();
              CHECK(f->buffer && f->entered && f->release);
              httpd_config_t cfg=HTTPD_DEFAULT_CONFIG();
              cfg.server_port=0; cfg.global_user_ctx=f; cfg.global_user_ctx_free_fn=release_context;
              CHECK(httpd_start(&f->server,&cfg)==ESP_OK);
              CHECK(httpd_queue_work(f->server,server_work,f)==ESP_OK);
              CHECK(xSemaphoreTake(f->entered,pdMS_TO_TICKS(3000))==pdTRUE);
              CHECK(uxTaskPriorityGet(NULL)<4);
              int64_t begin=esp_timer_get_time(); CHECK(begin>=0);
              uint64_t deadline=(uint64_t)begin/1000u+5000u;
              CHECK(room_sdk_stop_request(&worker,window,deadline,f->server,observed_stop));
              unsigned polls=0;
              while(esp_timer_get_time()-begin<(late?5200000:200000)) {
                  CHECK(atomic_load(&f->stop_entered));
                  CHECK(!atomic_load(&f->stop_done) && !atomic_load(&f->callback_done));
                  CHECK(atomic_load(&f->freed)==0);
                  room_sdk_stop_result result=room_sdk_stop_poll(&worker,window,false);
                  CHECK(result==ROOM_SDK_WAIT || (late && result==ROOM_SDK_LOCKED));
                  polls++; vTaskDelay(pdMS_TO_TICKS(50));
              }
              CHECK(polls>1);
              CHECK(room_sdk_stop_poll(&worker,window,false)==(late?ROOM_SDK_LOCKED:ROOM_SDK_WAIT));
              CHECK(xSemaphoreGive(f->release)==pdTRUE);
              int64_t wait=esp_timer_get_time();
              while(!atomic_load(&f->stop_done)) {
                  CHECK(esp_timer_get_time()-wait<4000000);
                  vTaskDelay(pdMS_TO_TICKS(20));
              }
              CHECK(f->stop_result==ESP_OK && atomic_load(&f->callback_done));
              CHECK(atomic_load(&f->freed)==1 && !f->buffer);
              CHECK(room_sdk_stop_poll(&worker,window,false)==(late?ROOM_SDK_LOCKED:ROOM_SDK_WAIT));
              room_sdk_stop_result result=room_sdk_stop_poll(&worker,window,true);
              while(result==ROOM_SDK_WAIT) {
