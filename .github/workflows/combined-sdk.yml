name: ESP32-C3 reconciled candidate and SDK worker runtime
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ['.github/workflows/combined-sdk.yml']
permissions: {}
concurrency:
  group: combined-sdk-20261127
  cancel-in-progress: true
jobs:
  regression:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/combined-sdk-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Offline host regressions and exact ESP32-C3 build
