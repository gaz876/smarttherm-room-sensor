name: Public history secret audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ['.github/workflows/audit-history-20261127.yml']
permissions: {}
concurrency:
  group: public-history-audit-20261127
  cancel-in-progress: true
jobs:
  scan:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/gitleaks-history-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Scan advertised public Git history without exposing findings
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 -o scanner.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb scanner.tar.gz | sha256sum --check --strict
          tar -xOzf scanner.tar.gz gitleaks > gitleaks
          chmod 500 gitleaks
          test "$(./gitleaks version)" = 8.30.1
          git -c credential.helper= -c core.hooksPath=/dev/null clone --mirror -- https://github.com/gaz876/smarttherm-room-sensor.git public.git > clone.log 2>&1
          test "$(git --git-dir=public.git rev-parse --is-shallow-repository)" = false
          git --git-dir=public.git fsck --full > fsck.log 2>&1
          printf 'HISTORY_REF_COUNT=%s\n' "$(git --git-dir=public.git for-each-ref --format='%(refname)' | wc -l)"
          printf 'HISTORY_COMMIT_COUNT=%s\n' "$(git --git-dir=public.git rev-list --all --count)"
          printf 'HISTORY_MAIN=%s\n' "$(git --git-dir=public.git rev-parse refs/heads/main)"
          printf 'HISTORY_CANDIDATE=%s\n' "$(git --git-dir=public.git rev-parse refs/heads/experiment/session-20261126-dhcp-8c4d2f)"
          printf 'HISTORY_PROTECTED=%s\n' "$(git --git-dir=public.git rev-parse refs/heads/experiment/wifi-policy-20261126)"
          git --git-dir=public.git for-each-ref --format='%(objectname) %(refname)' | LC_ALL=C sort > refs.txt
          sha256sum refs.txt
          printf '[extend]\nuseDefault = true\n' > scan.toml
          touch empty.ignore
          test ! -e public.git/.gitleaksignore
          set +e
          timeout 240s env -i PATH=/usr/bin:/bin HOME="$work" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 "$work/gitleaks" git --config "$work/scan.toml" --gitleaks-ignore-path "$work/empty.ignore" --ignore-gitleaks-allow --no-banner --redact=100 --exit-code 42 --log-opts='--all --full-history -m --root' --report-format json --report-path "$work/findings.json" "$work/public.git" > scanner.log 2>&1
          rc=$?
          set -e
          printf 'SCANNER_EXIT=%s\n' "$rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 42 ]; then echo HISTORY_SCAN_ERROR; exit 1; fi
          python3 - "$rc" <<'PY'
          import json, pathlib, sys
          report = pathlib.Path("findings.json")
          if not report.is_file():
              raise SystemExit("HISTORY_REPORT_MISSING")
          findings = json.loads(report.read_text())
          if not isinstance(findings, list):
              raise SystemExit("HISTORY_REPORT_INVALID")
          print("HISTORY_FINDING_COUNT=" + str(len(findings)))
          if int(sys.argv[1]) != 0 or findings:
              raise SystemExit("HISTORY_REVIEW_REQUIRED")
          print("HISTORY_SCAN_OK")
          PY
          # Do not print scanner output, matches, report or source contents.
          # No upload, cache, credentials, checkout, or private repository access.
