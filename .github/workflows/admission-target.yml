          work="$RUNNER_TEMP/room-integrated-20261128"
          mkdir "$work" "$work/input"
          git init -q "$work/repo"
          git -C "$work/repo" -c credential.helper= -c core.hooksPath=/dev/null fetch --no-tags --depth=1 https://github.com/gaz876/smarttherm-room-sensor.git "$source_sha"
