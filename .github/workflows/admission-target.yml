name: ESP32-C3 integrated HTTP candidate target-only retry
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ['.github/workflows/admission-target.yml']
permissions: {}
concurrency:
  group: admission-target-20261127
  cancel-in-progress: true
jobs:
  target:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/admission-target-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {}
    steps:
