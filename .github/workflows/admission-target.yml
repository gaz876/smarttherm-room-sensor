          MANIFEST
          test "$(wc -l < "$work/manifest")" = 90
          while read -r expected path; do
            test "$(git -C "$work/repo" rev-parse "$source_sha:$path")" = "$expected"
            mkdir -p "$work/input/$(dirname "$path")"
            git -C "$work/repo" show "$source_sha:$path" > "$work/input/$path"
            test "$(git hash-object "$work/input/$path")" = "$expected"
          done < "$work/manifest"
          grep -Fq 'room_network_owner_prepare(selected_key,NULL,&status)' "$work/input/main/room_network.c"
          echo INTEGRATED_SOURCE_SHA="$source_sha"
          echo INTEGRATED_INPUT_BLOBS_OK=90
      - name: Exact target build and separate inactive symbol link qualification
        if: always() && steps.prepare.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          work="$RUNNER_TEMP/room-integrated-20261128"
          image=docker.io/espressif/idf@sha256:e5b767c64fdfdf427aa14cc7aaa15d24caf2f22c78241c5a3ed18150cfa7f05c
          cat > "$work/input/link-probe.cmake" <<'CMAKE'
          
          # Test-only link retention. No startup call or real listener.
          target_link_libraries(${COMPONENT_LIB} INTERFACE
              "-Wl,-u,room_network_owner_prepare"
              "-Wl,-u,room_http_backend_prepare_owner"
              "-Wl,-u,room_http_backend_offer"
              "-Wl,-u,room_http_backend_reply"
              "-Wl,-u,room_http_backend_finish"
              "-Wl,-u,room_http_idf_driver_init"
              "-Wl,-u,room_http_idf_peer_observe"
              "-Wl,-u,room_apsta_events_peer_attach"
              "-Wl,-u,room_apsta_events_peer_epoch"
              "-Wl,-u,room_wifi_apsta_link_peer_epoch"
          )
          CMAKE
          cat > "$work/input/target-build.sh" <<'TARGET'
          set -euo pipefail
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = 051e4c4eb20346e043cdd47bc388fde75ff8af63
          git -C "$IDF_PATH" diff --quiet
          git -C "$IDF_PATH" diff --cached --quiet
          git -C "$IDF_PATH" submodule status --recursive > /tmp/submodules.txt
          if grep -q "^[+U-]" /tmp/submodules.txt; then exit 1; fi
          sha256sum /tmp/submodules.txt
          idf.py --version
          riscv32-esp-elf-gcc --version
          test "$(riscv32-esp-elf-gcc -dumpfullversion)" = 15.2.0
          python -m pip check
          mkdir /tmp/candidate
          cp -R --no-preserve=ownership /input/main /input/src /input/CMakeLists.txt /input/sdkconfig.defaults /tmp/candidate/
          cd /tmp/candidate
          idf.py set-target esp32c3
          idf.py build
          grep -qx "CONFIG_ROOM_WIFI_HMAC_KEY_ID=-1" sdkconfig
          test -s build/room_sensor.elf
          test -s build/room_sensor.bin
          for unit in room_network_owner room_http_backend room_http_idf_driver room_http_idf_peer room_apsta_events room_wifi_apsta_link; do
            test -s "build/esp-idf/main/CMakeFiles/__idf_main.dir/$unit.c.obj"
            echo TARGET_OBJECT_OK="$unit"
          done
          idf.py size
          sha256sum build/room_sensor.bin
          echo TARGET_INTEGRATED_EXACT_BUILD_OK
          # Separate build of a local copy to ensure otherwise unused new APIs
          # resolve at target link time; do not modify the published candidate.
          cat /input/link-probe.cmake >> main/CMakeLists.txt
          idf.py build
          grep -qx "CONFIG_ROOM_WIFI_HMAC_KEY_ID=-1" sdkconfig
          riscv32-esp-elf-nm --defined-only build/room_sensor.elf > /tmp/symbols.txt
          for symbol in room_network_owner_prepare room_http_backend_prepare_owner room_http_backend_offer room_http_backend_reply room_http_backend_finish room_http_idf_driver_init room_http_idf_peer_observe room_apsta_events_peer_attach room_apsta_events_peer_epoch room_wifi_apsta_link_peer_epoch; do
            grep -E "[[:space:]][Tt][[:space:]]$symbol$" /tmp/symbols.txt
          done
          idf.py size
          sha256sum build/room_sensor.bin
          echo TARGET_INTEGRATED_LINK_PROBE_OK
          TARGET
          # Audited public input only. The bind mount is read-only; no group/other write.
          chmod -R a+rX -- "$work/input"
          test -z "$(find "$work/input" -perm /022 -print -quit)"
          docker pull --platform linux/amd64 "$image"
          docker image inspect --format '{{.Id}} {{.Os}}/{{.Architecture}} {{json .RepoDigests}}' "$image"
          docker run --rm --platform linux/amd64 --network none --cap-drop ALL --security-opt no-new-privileges --mount "type=bind,source=$work/input,target=/input,readonly" -e IDF_COMPONENT_MANAGER=0 -e IDF_CCACHE_ENABLE=0 "$image" bash /input/target-build.sh
