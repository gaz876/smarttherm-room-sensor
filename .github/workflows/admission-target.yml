name: ESP32-C3 HTTP backend host regression
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ['.github/workflows/admission-target.yml']
permissions: {}
concurrency:
  group: admission-target-20261127
  cancel-in-progress: true
jobs:
  host:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/admission-target-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Fetch immutable audited public source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          source_sha=7f7a3c7076a217b633e3a400e54593a7f629aa9a
          work="$RUNNER_TEMP/room-backend-host"
          mkdir "$work" "$work/input"
          git init -q "$work/repo"
          git -C "$work/repo" -c credential.helper= -c core.hooksPath=/dev/null fetch --no-tags --depth=1 https://github.com/gaz876/smarttherm-room-sensor.git "$source_sha"
          test "$(git -C "$work/repo" rev-parse FETCH_HEAD)" = "$source_sha"
          cat > "$work/manifest" <<'MANIFEST'
          2a093fcdec820a59b360003ef16128aa8d771745 main/room_http_backend.c
          00988e22e55d32a8fbb49df24f198c1b63191b8d main/room_http_backend.h
          fbfee754f2870123a29a38e8458a0e366da1b800 main/room_http_idf_driver.c
          ce756ae392ed1609e84d90ed60ecb81fb9571083 main/room_http_idf_driver.h
          98b7a768eda467493ffab06703eb952fa17ca6db main/room_http_idf_peer.c
          1569cd043490eb8fc8eb0da452a89d552da758cc main/room_http_idf_peer.h
          524cb78cfaaa80e1e1c683529753a91c84081ce2 main/room_network_owner.c
          0911fa3312e6cf254afd8b66f4308b968796a238 main/room_network_owner.h
          333b7ff9c53f1aa27473976ab9a725170aaf228f main/room_sdk_stop.c
          72ee8b425f6c815928b0f0d8c4cd7066300d3748 src/room_admission.h
          6cae56a6d2ca2ec30f5aee81c547ab3fd3a787db src/room_http_lifecycle.h
          26a83193113b5581ad0e886c6e432b166d9c1ebe src/room_http_peer_guard.h
          aabb0d77274bef6828887cb9ec380416b519306e src/room_sdk_stop.h
          c5bd10c9b78dc8bd2f6038f1487709e593f3b6b1 tests/mock_http_backend/esp_http_server.h
          d0f3689bc672f3b68cad45ad002737192bc11521 tests/mock_http_backend/esp_netif.h
          e46e29ec7864ec9461b56d1d37e020877fdca159 tests/mock_http_backend/esp_timer.h
          a77a07f280c207708f1311c1f26b0fd056775255 tests/mock_http_backend/esp_wifi.h
          b6e3d7e68ae732740567d65ad1cf5d073c96f271 tests/mock_http_backend/freertos/FreeRTOS.h
          0c8e6ba6955f04fd95414973fe461efe1ea1778d tests/mock_http_backend/freertos/task.h
          8ba89c09a57a1d524c7012ebc5b4549248f6c966 tests/mock_http_backend/lwip/sockets.h
          69998df3bdd04bb91de36fdc2baf9a8b2815b2a3 tests/mock_http_backend/room_wifi_apsta_link.h
          d849fba41a22844925803c455e6e898096b295c5 tests/mock_http_backend/room_wifi_identity_provider.h
          0a3cde63d7be7b318a78345a03364b6f77f6318b tests/mock_http_backend/room_wifi_idf.h
          c4b50ad87f4905d9733cf67d827de3e882c3238f tests/mock_http_backend/room_wifi_secure_store.h
          21ceb5a29be06373c0cbc35eca868848835be136 tests/run_room_http_backend_host.sh
          1281e099c6d5f1b1bd2a2d9cfa52e250d19c1552 tests/test_room_http_backend.c
          MANIFEST
          test "$(wc -l < "$work/manifest")" = 26
          while read -r expected path; do
            test "$(git -C "$work/repo" rev-parse "$source_sha:$path")" = "$expected"
            mkdir -p "$work/input/$(dirname "$path")"
            git -C "$work/repo" show "$source_sha:$path" > "$work/input/$path"
            test "$(git hash-object "$work/input/$path")" = "$expected"
          done < "$work/manifest"
          echo BACKEND_SOURCE_SHA="$source_sha"
          echo BACKEND_INPUT_BLOBS_OK=26
      - name: Run synthetic backend fixtures on GCC and Clang
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          work="$RUNNER_TEMP/room-backend-host"
          cd "$work/input"
          env -i PATH=/usr/bin:/bin HOME="$work" UBSAN_OPTIONS=halt_on_error=1 timeout 180s sh tests/run_room_http_backend_host.sh | tee "$work/backend.log"
          for cc in gcc clang; do
            for mode in normal clean uncertain publish abort drain deadline stop-error worker idf-normal idf-name idf-start idf-register idf-peer idf-recv idf-send idf-size idf-timeout peer-guard idf-restart idf-evidence; do
              test "$(grep -Fxc "exit=0 $cc $mode" "$work/backend.log")" = 1
            done
          done
          test "$(grep -c '^PASS http-backend ' "$work/backend.log")" = 42
          test "$(grep -Fxc 'BACKEND_RESTART_WINDOWS=129' "$work/backend.log")" = 2
          test "$(grep -Fxc 'SDK_RESTART_WINDOWS=24 successful_exchanges=48' "$work/backend.log")" = 2
          test "$(grep -Fxc 'SDK_EVIDENCE_REJECTIONS=18' "$work/backend.log")" = 2
          echo BACKEND_HOST_RUNS_OK=42
