name: ESP32-C3 experimental build
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ['.github/workflows/esp32c3-build.yml']
permissions: {}
concurrency:
  group: esp32c3-experimental-build
  cancel-in-progress: true
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/sec2-footprint-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Build pinned public sensor and collect evidence
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          source_sha=f6eac7b9c6f00ac6429ddae98d5d6122d52731d7
          image=docker.io/espressif/idf@sha256:851f136a2c09cf17c13e952b9975606d7d1050be1480b1fd82c7ea4bce78cfb3
          work="$(mktemp -d)"
          cid=""
          trap 'if [ -n "$cid" ]; then docker rm -f "$cid" >/dev/null; fi; rm -rf "$work"' EXIT
          out="$RUNNER_TEMP/room-sensor-artifacts"
          mkdir "$out"
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git init -q "$work/repo"
          git -C "$work/repo" -c credential.helper= fetch --no-tags --depth=1 https://github.com/gaz876/smarttherm-room-sensor.git "$source_sha"
          test "$(git -C "$work/repo" rev-parse FETCH_HEAD)" = "$source_sha"
          mkdir "$work/input"
          git -C "$work/repo" archive "$source_sha" CMakeLists.txt main src sdkconfig.defaults tests | tar -x -C "$work/input"
          git -C "$work/repo" ls-tree -r "$source_sha" -- CMakeLists.txt main src sdkconfig.defaults tests | tee "$out/source-blobs.txt"
          printf 'source=%s\nimage=%s\nsdk=%s\nworkflow=%s\n' "$source_sha" "$image" 880a203ae603d08a94d06aa01e0d6761958e5e9e "$GITHUB_SHA" > "$out/provenance.txt"
          docker pull --platform linux/amd64 "$image"
          docker image inspect --format '{{.Id}} {{.Os}}/{{.Architecture}} {{json .RepoDigests}}' "$image" | tee "$out/image.txt"
          cid="$(docker create --platform linux/amd64 --network none --cap-drop ALL --security-opt no-new-privileges --mount "type=bind,source=$work/input,target=/input,readonly" -e IDF_COMPONENT_MANAGER=0 -e IDF_CCACHE_ENABLE=0 "$image" bash -euo pipefail -c '
            test "$(git -C "$IDF_PATH" rev-parse HEAD)" = 880a203ae603d08a94d06aa01e0d6761958e5e9e
            git -C "$IDF_PATH" diff --quiet
            git -C "$IDF_PATH" diff --cached --quiet
            git -C "$IDF_PATH" submodule status --recursive > /tmp/submodules.txt
            cat /tmp/submodules.txt
            if grep -q "^[+U-]" /tmp/submodules.txt; then exit 1; fi
            idf.py --version
            riscv32-esp-elf-gcc --version
            test "$(riscv32-esp-elf-gcc -dumpfullversion)" = 14.2.0
            sha256sum "$(command -v riscv32-esp-elf-gcc)"
            python -m pip list --format=freeze | tee /tmp/python-packages.txt
            python -m pip check
            dpkg-query -W > /tmp/os-packages.txt
            cmake --version
            ninja --version
            mkdir /tmp/room_sensor
            cp -R --no-preserve=ownership /input/. /tmp/room_sensor/
            cd /tmp/room_sensor
            idf.py set-target esp32c3
            idf.py build
            grep -qx "CONFIG_ROOM_I2C_SDA=4" sdkconfig
            grep -qx "CONFIG_ROOM_I2C_SCL=5" sdkconfig
            grep -qx "CONFIG_ESP_PROTOCOMM_SUPPORT_SECURITY_VERSION_2=y" sdkconfig
            if grep -Eq "^CONFIG_ESP_PROTOCOMM_SUPPORT_SECURITY_VERSION_[01]=y$" sdkconfig; then exit 1; fi
            grep -qx "CONFIG_ROOM_WIFI_HMAC_KEY_ID=-1" sdkconfig
            riscv32-esp-elf-nm build/room_sensor.elf > /tmp/link-symbols.txt
            for sym in room_sec2_transport_start room_sec2_transport_exchange room_sec2_transport_finish room_sec2_transport_destroy protocomm_security2 room_apsta_task_bind room_apsta_task_open room_apsta_task_poll room_apsta_task_packet room_apsta_task_sent room_apsta_task_close room_apsta_events_unbind room_wifi_apsta_link_bind room_wifi_apsta_link_init_missing; do
              grep -E "[[:space:]]$sym$" /tmp/link-symbols.txt || exit 1
            done
            idf.py size | tee /tmp/size.txt
            idf.py size-components > /tmp/size-components.txt
            idf.py size-files > /tmp/size-files.txt
            python "$IDF_PATH/components/partition_table/gen_esp32part.py" build/partition_table/partition-table.bin > /tmp/partitions.txt
            sha256sum build/room_sensor.bin build/room_sensor.elf build/room_sensor.map build/bootloader/bootloader.bin build/partition_table/partition-table.bin | sed -E "s#  build/(bootloader/|partition_table/)?#  #" | tee /tmp/binary-sha256.txt
            echo ESP32C3_BUILD_OK
            # Real repository integration fixtures; all execution stays in the
            # already pinned, offline, capability-dropped build container.
            mkdir /tmp/room_host
            command -v gcc
            for cc in gcc clang; do
              if ! command -v "$cc" >/dev/null; then echo "HOST_COMPILER_UNAVAILABLE $cc"; continue; fi
              "$cc" --version | head -n 1
              for t in owner handoff; do
                "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -g -fno-omit-frame-pointer -fno-pie -no-pie -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc "tests/test_room_wifi_$t.c" -o "/tmp/room_host/$cc-wifi-$t"
                timeout 15s "/tmp/room_host/$cc-wifi-$t"
                echo "HOST_WIFI_OK $cc $t"
              done
              "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -g -fno-omit-frame-pointer -fno-pie -no-pie -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc -Imain -Itests/mock_wifi tests/test_room_wifi_idf.c main/room_wifi_idf.c -o "/tmp/room_host/$cc-wifi-idf"
              timeout 15s "/tmp/room_host/$cc-wifi-idf"
              echo "HOST_STA_OK $cc default"
              for mode in attach start handoff; do
                timeout 15s "/tmp/room_host/$cc-wifi-idf" "$mode"
                echo "HOST_STA_OK $cc $mode"
              done
              "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -g -fno-omit-frame-pointer -fno-pie -no-pie -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc -Imain -Itests/mock_combined -Itests/mock_apsta_owner -Itests/mock_sec2_transport -Itests/mock_task -Itests/mock_events tests/test_room_wifi_combined.c main/room_wifi_idf.c tests/fixture_room_wifi_apsta_link.c main/room_apsta_session.c main/room_apsta_events.c main/room_apsta_task.c main/room_sec2_transport.c -o "/tmp/room_host/$cc-combined"
              for scenario in normal expiry revoked notready prepare partial timeout first_normal first_late first_error first_unavailable first_valid first_changed save_ok save_lost save_write_error save_read_error save_reload_error; do
                timeout 15s "/tmp/room_host/$cc-combined" "$scenario"
                echo "HOST_COMBINED_OK $cc $scenario"
              done
              "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -g -fno-omit-frame-pointer -fno-pie -no-pie -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc -Itests/mock_sec2 tests/test_room_sec2_context.c -o "/tmp/room_host/$cc-sec2-context"
              timeout 15s "/tmp/room_host/$cc-sec2-context"
              echo "HOST_SEC2_OK $cc identity"
              for t in session events task; do
                extra=()
                case "$t" in
                  events) extra=(main/room_apsta_events.c);;
                  task) extra=(main/room_apsta_events.c main/room_apsta_task.c);;
                esac
                "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -g -fno-omit-frame-pointer -fno-pie -no-pie -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc -Itests/mock_apsta_owner -Itests/mock_sec2_transport -Itests/mock_task -Itests/mock_events "tests/test_room_apsta_$t.c" main/room_apsta_session.c main/room_sec2_transport.c "${extra[@]}" -o "/tmp/room_host/$cc-$t"
                timeout 15s "/tmp/room_host/$cc-$t"
                echo "HOST_INTEGRATION_OK $cc $t"
              done
            done
          ')"
          docker start -a "$cid" 2>&1 | tee "$out/build.log"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$cid")" = 0
          copy_file() {
            docker cp "$cid:$1" "$out/$2"
            test -f "$out/$2" && test ! -L "$out/$2" && test -s "$out/$2"
          }
          copy_file /tmp/room_sensor/build/room_sensor.bin room_sensor.bin
          copy_file /tmp/room_sensor/build/room_sensor.elf room_sensor.elf
          copy_file /tmp/room_sensor/build/room_sensor.map room_sensor.map
          copy_file /tmp/room_sensor/build/bootloader/bootloader.bin bootloader.bin
          copy_file /tmp/room_sensor/build/partition_table/partition-table.bin partition-table.bin
          copy_file /tmp/room_sensor/build/project_description.json project_description.json
          copy_file /tmp/room_sensor/sdkconfig sdkconfig
          copy_file /tmp/submodules.txt submodules.txt
          copy_file /tmp/python-packages.txt python-packages.txt
          copy_file /tmp/os-packages.txt os-packages.txt
          copy_file /tmp/size.txt size.txt
          copy_file /tmp/size-components.txt size-components.txt
          copy_file /tmp/size-files.txt size-files.txt
          copy_file /tmp/partitions.txt partitions.txt
          copy_file /tmp/binary-sha256.txt binary-sha256.txt
          cd "$out"
          files=(source-blobs.txt provenance.txt image.txt build.log room_sensor.bin room_sensor.elf room_sensor.map bootloader.bin partition-table.bin project_description.json sdkconfig submodules.txt python-packages.txt os-packages.txt size.txt size-components.txt size-files.txt partitions.txt binary-sha256.txt)
          test "$(find . -mindepth 1 -maxdepth 1 | wc -l)" = "${#files[@]}"
          for f in "${files[@]}"; do test -f "$f" && test ! -L "$f" && test -s "$f" || exit 1; done
          sha256sum -c --strict binary-sha256.txt
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum -c --strict SHA256SUMS.txt
          echo ESP32C3_ARTIFACT_SET_OK
      - name: Retain experimental public artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-sensor-esp32c3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/room-sensor-artifacts
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
