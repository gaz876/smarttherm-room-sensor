name: ESP32-C3 offline completion adapter runtime probe
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ['.github/workflows/ack-runtime-probe.yml']
permissions: {}
concurrency:
  group: ack-runtime-probe-20261127
  cancel-in-progress: true
jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/ack-runtime-probe-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Build and run pinned offline adapter in QEMU
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          image=docker.io/espressif/idf@sha256:e5b767c64fdfdf427aa14cc7aaa15d24caf2f22c78241c5a3ed18150cfa7f05c
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/input/main"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 -o "$work/input/qemu.tar.xz" https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20260417/qemu-riscv32-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz
          test "$(stat -c %s "$work/input/qemu.tar.xz")" = 16842920
          (cd "$work/input"; echo '547f03e04701a92cbb699f7f7d015adc1f5b5ef93cbb94c0dd9b7107e2d84e77  qemu.tar.xz' | sha256sum -c -)
          source_sha=8cd45dfb1e632e3709a2c51856cc31bcba44bfeb
          git init -q "$work/repo"
          git -C "$work/repo" -c credential.helper= fetch --no-tags --depth=1 https://github.com/gaz876/smarttherm-room-sensor.git "$source_sha"
          test "$(git -C "$work/repo" rev-parse FETCH_HEAD)" = "$source_sha"
          git -C "$work/repo" show "$source_sha:tests/browser_worker/completion_adapter.h" > "$work/input/main/completion_adapter.h"
          test "$(git hash-object "$work/input/main/completion_adapter.h")" = 47104a703fbae97821b0d163de594dc2a0eb8113
          git -C "$work/repo" show "$source_sha:tests/browser_worker/mailbox.h" > "$work/input/main/mailbox.h"
          test "$(git hash-object "$work/input/main/mailbox.h")" = c73f0dd25a66edd063f30d314a40b590acebe859
          git -C "$work/repo" show "$source_sha:tests/browser_worker/worker_model.h" > "$work/input/main/worker_model.h"
          test "$(git hash-object "$work/input/main/worker_model.h")" = bbb110d76bffede4942330ce7d59a99eca8af42d
          git -C "$work/repo" show "$source_sha:tests/browser_worker/test_ack_adapter.c" > "$work/input/main/test_ack_adapter.c"
          test "$(git hash-object "$work/input/main/test_ack_adapter.c")" = 10ec3812a774cbafb9c761adf8edf44a51a98607
          cat > "$work/input/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(ack_runtime_probe)
          EOF
          cat > "$work/input/main/CMakeLists.txt" <<'EOF'
          idf_component_register(SRCS "probe.c" "test_ack_adapter.c" INCLUDE_DIRS "." REQUIRES freertos heap esp_timer)
          set_source_files_properties(test_ack_adapter.c PROPERTIES COMPILE_DEFINITIONS "main=offline_ack_regression")
          target_compile_options(${COMPONENT_LIB} PRIVATE -Wall -Wextra -Werror -UNDEBUG)
          EOF
          cat > "$work/input/main/probe.c" <<'EOF'
          #include "completion_adapter.h"
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include "sdkconfig.h"
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          #include "freertos/queue.h"
          #include "freertos/semphr.h"
          #include "esp_heap_caps.h"
          #include "esp_timer.h"
          #if !CONFIG_IDF_TARGET_ESP32C3
          #error incorrect target
          #endif
          #ifdef NDEBUG
          #error assertions required
          #endif
          enum { N=128, BYTES=4096, STACK_BYTES=4096 };
          static ack_adapter model;
          static uint8_t owner_buffer[BYTES], peer_buffer[BYTES];
          static QueueHandle_t to_owner, to_peer, finished;
          static SemaphoreHandle_t gate;
          typedef struct { unsigned role; UBaseType_t remaining; } report;
          extern int offline_ack_regression(void);
          static void require_at(bool ok,int line) {
              if(!ok) { printf("ACK_RUNTIME_FAIL line=%d\n",line); fflush(stdout); abort(); }
          }
          #define CHECK(x) require_at((x),__LINE__)
          static bool clock_read(void *ctx,uint64_t *ms) {
              (void)ctx; int64_t us=esp_timer_get_time();
              if(!ms || us<0) return false;
              *ms=(uint64_t)us/1000u; return true;
          }
          static ack_result step(mb_event e,bool receipt,mb_reply *out) {
              e.window=1;
              return ack_step(&model,e,receipt,out,clock_read,NULL);
          }
          static void send_value(QueueHandle_t q,uint64_t x) {
              CHECK(xQueueSend(q,&x,pdMS_TO_TICKS(6000))==pdTRUE);
          }
          static uint64_t receive_value(QueueHandle_t q) {
              uint64_t x=0;
              CHECK(xQueueReceive(q,&x,pdMS_TO_TICKS(6000))==pdTRUE);
              return x;
          }
          static void finish(unsigned role,uint8_t *buf) {
              memset(buf,0,BYTES);
              report r={role,uxTaskGetStackHighWaterMark(NULL)};
              CHECK(xQueueSend(finished,&r,pdMS_TO_TICKS(2000))==pdTRUE);
              vTaskDelete(NULL);
          }
          static void owner(void *arg) {
              (void)arg; mb_reply out;
              CHECK(xSemaphoreTake(gate,pdMS_TO_TICKS(2000))==pdTRUE);
              for(unsigned i=1;i<=N+1;i++) {
                  uint64_t t=receive_value(to_owner);
                  CHECK(t==i);
                  CHECK(step((mb_event){.action=MB_TAKE_REQUEST,.ticket=t,.output=owner_buffer,.size=BYTES},false,&out)==ACK_OK);
                  CHECK(out.length==BYTES && out.ticket==t);
                  for(unsigned k=0;k<BYTES;k++) {
                      CHECK(owner_buffer[k]==(uint8_t)(i+k));
                      owner_buffer[k]^=0x5a;
                  }
                  CHECK(step((mb_event){.action=MB_PUBLISH,.ticket=t,.input=owner_buffer,.size=BYTES},false,&out)==ACK_OK);
                  send_value(to_peer,t);
                  CHECK(receive_value(to_owner)==t);
                  CHECK(step((mb_event){.ticket=t},true,&out)==ACK_WAIT);
                  send_value(to_peer,t);
                  if(i==N+1) {
                      int64_t start=esp_timer_get_time();
                      vTaskDelay(pdMS_TO_TICKS(2100));
                      CHECK(esp_timer_get_time()-start>=2000000);
                      CHECK(step((mb_event){.ticket=t},true,&out)==ACK_REJECT);
                  }
                  CHECK(receive_value(to_owner)==t);
                  ack_result result=step((mb_event){.ticket=t},true,&out);
                  if(i<=N) CHECK(result==ACK_OK && out.ticket==t);
                  else CHECK(result==ACK_REJECT);
                  CHECK(step((mb_event){.ticket=t},true,&out)==ACK_REJECT);
                  send_value(to_peer,t);
              }
              finish(1,owner_buffer);
          }
          static void peer(void *arg) {
              (void)arg; mb_reply out;
              CHECK(xSemaphoreTake(gate,pdMS_TO_TICKS(2000))==pdTRUE);
              for(unsigned i=1;i<=N+1;i++) {
                  for(unsigned k=0;k<BYTES;k++) peer_buffer[k]=(uint8_t)(i+k);
                  CHECK(step((mb_event){.action=MB_SUBMIT,.input=peer_buffer,.size=BYTES},false,&out)==ACK_OK);
                  uint64_t t=out.ticket; CHECK(t==i);
                  send_value(to_owner,t);
                  CHECK(receive_value(to_peer)==t);
                  CHECK(step((mb_event){.action=MB_TAKE_REPLY,.ticket=t,.output=peer_buffer,.size=BYTES},false,&out)==ACK_OK);
                  CHECK(out.length==BYTES && out.ticket==t);
                  for(unsigned k=0;k<BYTES;k++) CHECK(peer_buffer[k]==((uint8_t)(i+k)^0x5a));
                  send_value(to_owner,t);
                  CHECK(receive_value(to_peer)==t);
                  if(i==N+1) vTaskDelay(pdMS_TO_TICKS(2300));
                  ack_result result=step((mb_event){.action=MB_SENT,.ticket=t,.flag=true},false,&out);
                  CHECK(result==(i<=N?ACK_OK:ACK_REJECT));
                  send_value(to_owner,t);
                  CHECK(receive_value(to_peer)==t);
              }
              finish(2,peer_buffer);
          }
          void app_main(void) {
              CHECK(offline_ack_regression()==0);
              puts("ACK_RUNTIME_REGRESSION_OK");
              const uint32_t caps=MALLOC_CAP_INTERNAL|MALLOC_CAP_8BIT;
              CHECK(uxTaskPriorityGet(NULL)<2);
              ack_init(&model); mb_reply out;
              CHECK(step((mb_event){.action=MB_OPEN},false,&out)==ACK_OK);
              CHECK(step((mb_event){.action=MB_STARTED,.flag=true},false,&out)==ACK_OK);
              size_t before=heap_caps_get_free_size(caps);
              to_owner=xQueueCreate(1,sizeof(uint64_t));
              to_peer=xQueueCreate(1,sizeof(uint64_t));
              finished=xQueueCreate(2,sizeof(report));
              gate=xSemaphoreCreateCounting(2,0);
              CHECK(to_owner && to_peer && finished && gate);
              CHECK(xTaskCreate(owner,"owner",STACK_BYTES,NULL,2,NULL)==pdPASS);
              CHECK(xTaskCreate(peer,"peer",STACK_BYTES,NULL,2,NULL)==pdPASS);
              size_t live=heap_caps_get_free_size(caps);
              int64_t start=esp_timer_get_time();
              CHECK(xSemaphoreGive(gate)==pdTRUE);
              CHECK(xSemaphoreGive(gate)==pdTRUE);
              UBaseType_t remaining[2]={0,0};
              for(unsigned i=0;i<2;i++) {
                  report r={0};
                  CHECK(xQueueReceive(finished,&r,pdMS_TO_TICKS(10000))==pdTRUE);
                  CHECK(r.role>=1 && r.role<=2 && remaining[r.role-1]==0 && r.remaining>0);
                  remaining[r.role-1]=r.remaining;
              }
              int64_t elapsed=esp_timer_get_time()-start; CHECK(elapsed>=2000000);
              /* Single-core higher-priority tasks self-delete after sending their reports.
                 Idle runs before main checks cleanup; this is an offline fixture only. */
              vTaskDelay(pdMS_TO_TICKS(100));
              CHECK(step((mb_event){.action=MB_DRAINED,.flag=true,.drained=false},false,&out)==ACK_REJECT);
              CHECK(step((mb_event){.action=MB_DRAINED,.flag=true,.drained=true},false,&out)==ACK_OK);
              for(unsigned k=0;k<BYTES;k++) CHECK(!owner_buffer[k] && !peer_buffer[k]);
              CHECK(model.box.life.phase==W_DOWN);
              vQueueDelete(to_owner); vQueueDelete(to_peer); vQueueDelete(finished);
              vSemaphoreDelete(gate); vTaskDelay(pdMS_TO_TICKS(100));
              CHECK(heap_caps_check_integrity_all(true));
              size_t after=heap_caps_get_free_size(caps);
              printf("ACK_RUNTIME exchanges=%u expiry=1 model_bytes=%zu buffers=%zu stack_each=%u free_before=%zu free_live=%zu free_after=%zu min_free=%zu largest_after=%zu stack_remaining_1=%u stack_remaining_2=%u emulated_us=%lld\n",
                     (unsigned)N,sizeof(model),sizeof(owner_buffer)+sizeof(peer_buffer),(unsigned)STACK_BYTES,before,live,after,heap_caps_get_minimum_free_size(caps),heap_caps_get_largest_free_block(caps),(unsigned)remaining[0],(unsigned)remaining[1],(long long)elapsed);
              puts("ACK_RUNTIME_PASS"); fflush(stdout);
          }
          EOF
          sha256sum "$work/input/main/"*
          docker pull --platform linux/amd64 "$image"
          docker image inspect --format '{{.Id}} {{.Os}}/{{.Architecture}} {{json .RepoDigests}}' "$image"
          docker run --rm --platform linux/amd64 --network none --cap-drop ALL --security-opt no-new-privileges --mount "type=bind,source=$work/input,target=/input,readonly" -e IDF_COMPONENT_MANAGER=0 -e IDF_CCACHE_ENABLE=0 "$image" bash -euo pipefail -c '
            test "$(git -C "$IDF_PATH" rev-parse HEAD)" = 051e4c4eb20346e043cdd47bc388fde75ff8af63
            git -C "$IDF_PATH" diff --quiet
            git -C "$IDF_PATH" diff --cached --quiet
            git -C "$IDF_PATH" submodule status --recursive > /tmp/submodules.txt
            if grep -q "^[+U-]" /tmp/submodules.txt; then exit 1; fi
            idf.py --version
            riscv32-esp-elf-gcc --version
            test "$(riscv32-esp-elf-gcc -dumpfullversion)" = 15.2.0
            mkdir /tmp/qemu-tool /tmp/probe
            tar --no-same-owner --no-same-permissions -xJf /input/qemu.tar.xz -C /tmp/qemu-tool
            export PATH="/tmp/qemu-tool/qemu/bin:$PATH"
            command -v qemu-system-riscv32
            qemu-system-riscv32 --version
            cp -R --no-preserve=ownership /input/main /input/CMakeLists.txt /tmp/probe/
            cd /tmp/probe
            idf.py set-target esp32c3
            idf.py build
            test -s build/ack_runtime_probe.elf
            idf.py size
            rc=0
            timeout --kill-after=5s 45s idf.py qemu --qemu-extra-args="-nic none" </dev/null > /tmp/qemu.log 2>&1 || rc=$?
            tr -d "\r" < /tmp/qemu.log > /tmp/qemu-clean.log
            cat /tmp/qemu-clean.log
            test "$rc" = 0 || test "$rc" = 124
            test "$(grep -cx ACK_RUNTIME_PASS /tmp/qemu-clean.log)" = 1
            test "$(grep -cx ACK_RUNTIME_REGRESSION_OK /tmp/qemu-clean.log)" = 1
            test "$(grep -cx "offline ack adapter: 88 checks PASS" /tmp/qemu-clean.log)" = 1
            test "$(grep -c "^ACK_RUNTIME exchanges=128 expiry=1 " /tmp/qemu-clean.log)" = 1
            if grep -E "ACK_RUNTIME_FAIL|Guru Meditation|assert failed|abort.*was called" /tmp/qemu-clean.log; then exit 1; fi
            echo QEMU_ACK_RUNTIME_OK
          '
