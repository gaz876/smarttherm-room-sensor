name: Safety host tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/safety-host-tests.yml']
permissions: {}
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Test audited public baseline
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git -c credential.helper= clone --no-checkout -- https://github.com/gaz876/smarttherm-room-sensor.git "$work/repo"
          cd "$work/repo"
          git checkout --detach 83f71e796a13b4b1b9712dc5d718ae602a4c8f8c
          test "$(git rev-parse HEAD)" = 83f71e796a13b4b1b9712dc5d718ae602a4c8f8c
          g++ --version
          tests=(tests/test.cpp tests/test_adapter.cpp tests/test_bounds.cpp tests/test_guard.cpp tests/test_heating.cpp tests/test_limits.cpp tests/test_ramp.cpp tests/test_reserve.cpp tests/test_wired.cpp)
          for f in "${tests[@]}"; do
            g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all -Isrc "$f" -o "$work/test"
            "$work/test"
            printf 'PASS: %s\n' "$f"
          done
          echo 'PASS: 9/9 host test programs'
